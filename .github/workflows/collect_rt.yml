# .github/workflows/collect_rt.yml
name: Collect GRT Realtime Delays

on:
  schedule:
    # AM peak: 12:00 UTC = 08:00 EDT (runs Mon–Fri)
    - cron: '0 12 * * 1-5'
    # PM peak: 21:00 UTC = 17:00 EDT (runs Mon–Fri)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo to read/write files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install only what the collector needs
      - name: Install dependencies
        run: |
          pip install requests gtfs-realtime-bindings pandas pytz

      # 4. Download GTFS static feed
      - name: Download static GTFS
        run: |
          mkdir -p data/gtfs
          pip install requests
          python - <<'EOF'
          import requests, zipfile, io, ssl
          from requests.adapters import HTTPAdapter

          class WeakDHAdapter(HTTPAdapter):
              def init_poolmanager(self, *args, **kwargs):
                  ctx = ssl.create_default_context()
                  ctx.set_ciphers("DEFAULT:@SECLEVEL=1")
                  kwargs["ssl_context"] = ctx
                  super().init_poolmanager(*args, **kwargs)

          session = requests.Session()
          session.mount("https://", WeakDHAdapter())

          r = session.get(
              "https://webapps.regionofwaterloo.ca/api/grt-routes/api/staticfeeds/1",
              timeout=30
          )
          r.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(r.content)) as z:
              z.extractall("data/gtfs")
          print(f"✅ Extracted {len(z.namelist())} files")
          EOF

      # 5. Run the collector and parser
      - name: Collect and parse realtime feed
        run: python collect_and_parse_rt.py

      # 6. Commit the updated CSV back to the repo
      - name: Commit delay records
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/realtime/delay_records.csv
          git diff --staged --quiet || git commit -m \
            "auto: append RT delay snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push